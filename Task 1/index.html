
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile">

        <!-- Student Image -->
        <div class="image-section">
            <img src="./student.png" alt="Student Image">
        </div>

        <!-- Student Information -->
        <div class="info-section">

            <h1>Hamza Khan</h1>

            <h2>BS Computer Science</h2>

            <p>
                I am a Computer Science student interested in web development,
                programming, and modern technologies. I enjoy learning new
                skills and creating useful software projects.
            </p>

            <!-- Three Skills -->
            <div class="skills">
                <span>HTML & CSS</span>
                <span>C++</span>
                <span>Flutter</span>
            </div>

        </div>

    </div>

</body>
</html>
